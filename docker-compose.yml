version: '3.8'

services:
  # Skill Scanner API service
  skill-scanner-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: skill-scanner:${TAG:-latest}
    container_name: skill-scanner-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      # Worker configuration (can override .env)
      - SKILL_SCANNER_WORKERS=${WORKERS:-2}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      # Optional: mount configuration
      # - ./config:/app/config:ro
      # Optional: persistent cache
      - scanner-cache:/app/.cache
    extra_hosts:
      # Allow container to access host machine for local LLM
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health').raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M
    networks:
      - scanner-network

  # Optional: Nginx reverse proxy
  # Uncomment to enable reverse proxy with SSL support
  # nginx:
  #   image: nginx:alpine
  #   container_name: skill-scanner-nginx
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./nginx/ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - skill-scanner-api
  #   restart: unless-stopped
  #   networks:
  #     - scanner-network

volumes:
  scanner-cache:
    driver: local

networks:
  scanner-network:
    driver: bridge
